[package]
name = "city-challenge-backend"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros", "compress-gzip"] }
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres"] }
log = "0.4"
env_logger = "0.11"
actix-cors = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
anyhow = "1"

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "city_challenge_backend"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "build-data"
path = "src/bin/build_data.rs"
